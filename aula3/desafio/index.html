<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../style.css">
    <title>Perfil Interativo</title>
</head>
<body>
    <main>
        <h1 id="titulo">Gabriel Pedroso</h1>
        <p>Perfil Interativo</p>

        <label for="nome">Seu nome</label>
        <input type="text" id="nome" placeholder="Digite seu nome">
        <button type="button" id="atualizar">Atualizar nome</button>
        <p>Interações: <span id="interacoes">0</span></p>

        <button type="button" id="alternar-descricao">Mostrar / esconder descrição</button>
        <p id="descricao">Sou estudante de Sistemas de Informação e estou aprendendo HTML, CSS e JavaScript.</p>

        <button type="button" id="alternar-tema">Alternar tema</button>
    </main>
    <script src="script.js"></script>
</body>
</html>
